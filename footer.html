
<!-- Contact Footer Popup -->
<div id="contactOverlay"
style="display:none; position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.7); backdrop-filter:blur(5px); align-items:center; justify-content:center; padding:16px; overflow-y:auto;"
onclick="if(event.target===this) closeContactPopup()">

  <div style="position:relative; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; margin:auto; background:rgba(15,23,42,0.95); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:32px; box-shadow:0 10px 30px rgba(0,0,0,0.3); font-family:system-ui,-apple-system,sans-serif; color:#f8fafc; box-sizing:border-box;">

    <button type="button" onclick="closeContactPopup()"
    style="position:absolute; top:12px; right:16px; background:none; border:none; color:#94a3b8; font-size:26px; cursor:pointer;">&times;</button>

    <h3 style="margin-top:0; margin-bottom:8px; font-size:24px; font-weight:600; color:white;">Get in Touch</h3>

    <p style="margin-top:0; margin-bottom:24px; font-size:14px; color:#94a3b8;">Send a message directly to Himanshu.</p>

    <form action="https://api.web3forms.com/submit" method="POST"
    style="display:flex; flex-direction:column; gap:16px;">

      <input type="hidden" name="access_key" value="458ac6f8-221e-4b84-a6df-1252d56baf0b">

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:13px; color:#cbd5e1;">Your Name</label>
        <input type="text" name="name" placeholder="e.g. John Doe" required
        style="width:100%; padding:12px 16px; background:rgba(30,41,59,0.6); border:1px solid rgba(255,255,255,0.15); border-radius:8px; color:white; box-sizing:border-box;">
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:13px; color:#cbd5e1;">Email Address</label>
        <input type="email" name="email" placeholder="e.g. john@example.com" required
        style="width:100%; padding:12px 16px; background:rgba(30,41,59,0.6); border:1px solid rgba(255,255,255,0.15); border-radius:8px; color:white; box-sizing:border-box;">
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:13px; color:#cbd5e1;">Message</label>
        <textarea name="message" rows="4" placeholder="Write your message here..." required
        style="width:100%; padding:12px 16px; background:rgba(30,41,59,0.6); border:1px solid rgba(255,255,255,0.15); border-radius:8px; color:white; box-sizing:border-box; resize:vertical;"></textarea>
      </div>

      <button type="submit"
      style="margin-top:8px; width:100%; padding:12px 20px; background:linear-gradient(135deg,#4f46e5,#6366f1); color:white; font-weight:600; font-size:14px; border:none; border-radius:8px; cursor:pointer;">
        Send Message
      </button>
    </form>

    <div style="margin-top:28px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1); text-align:center;">
      <p style="font-size:11px; color:#94a3b8; margin-bottom:12px; letter-spacing:0.5px;">HIMANSHU SINGH • PROFILES</p>

      <div style="display:flex; justify-content:center; gap:8px; align-items:center;">
        <img src="https://raw.githubusercontent.com/himanshuclub88/portfolio/main/static/photo1.jpg" alt="Himanshu Singh profile" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid #4f46e5;">
        <img src="https://raw.githubusercontent.com/himanshuclub88/portfolio/main/static/photo2.jpg" alt="Himanshu Singh professional profile" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid #4f46e5;">
        <img src="https://raw.githubusercontent.com/himanshuclub88/portfolio/main/static/photo3.jpg" alt="Himanshu Singh data engineer profile" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid #4f46e5;">
      </div>
    </div>

  </div>
</div>

<script>
function openContactPopup() {
  document.getElementById('contactOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeContactPopup() {
  document.getElementById('contactOverlay').style.display = 'none';
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') closeContactPopup();
});
</script>
