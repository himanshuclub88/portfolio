<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Himanshu Singh | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        .portfolio {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    .custom-badge {
        position: absolute;

        /* Move slightly lower */
        right: clamp(8px, 1.2vw, 20px);
        bottom: clamp(2px, 0.5vw, 7px);

        cursor: pointer !important;
        pointer-events: auto !important;
        z-index: 999999 !important;

        /* Slightly larger for better coverage */
        height: clamp(36px, 3vw, 44px);
        min-width: clamp(185px, 17vw, 245px);

        padding: 0 clamp(16px, 1.3vw, 22px);

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;

        background: #ffffff;
        color: #3b2417;

        border: 1px solid rgba(59, 36, 23, 0.20);
        border-radius: 999px;

        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(11px, 0.95vw, 14px);
        font-weight: 600;
        letter-spacing: 0.1px;

        box-shadow:
            0 4px 14px rgba(0, 0, 0, 0.14),
            0 1px 4px rgba(0, 0, 0, 0.08);

        white-space: nowrap;

        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }

    .custom-badge::before {
        content: "♡";
        color: #6f5959;
        font-size: clamp(10px, 0.85vw, 13px);
        line-height: 1;
        animation: heartbeat 5.2s ease-in-out infinite;
    }

    @keyframes heartbeat {
        0%, 100% {
            transform: scale(1.3);
        }
        50% {
            transform: scale(1.5);
        }
    }

    .custom-badge::after {
        content: "";
        position: absolute;

        left: 12px;
        right: 12px;
        bottom: -3px;

        height: 1px;
        background: rgba(59, 36, 23, 0.18);
    }


    /* Read Aloud - separate floating control, aligned with the existing badge */
    .read-aloud-wrap {
        position: absolute;
        right: clamp(8px, 1.2vw, 20px);
        bottom: clamp(48px, 4.4vw, 62px);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 9px;
        z-index: 999999 !important;
        pointer-events: none;
    }

    .read-aloud-btn {
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        border: 1px solid rgba(59, 36, 23, 0.18);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.72);
        color: #3b2417;
        font-family: Arial, sans-serif;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        pointer-events: auto;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 14px rgba(0,0,0,.12), 0 1px 4px rgba(0,0,0,.06);
        transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .read-aloud-btn:hover {
        transform: scale(1.06);
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 6px 18px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.08);
    }

    .read-aloud-btn:active {
        transform: scale(.96);
    }

    .read-aloud-tip {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 10px;
        border: 1px solid rgba(59,36,23,.14);
        border-radius: 9px;
        background: rgba(255,255,255,.86);
        color: #3b2417;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 14px rgba(0,0,0,.10);
        opacity: 1;
        transform: translateX(0);
        transition: opacity .35s ease, transform .35s ease;
    }

    .read-aloud-tip.hide {
        opacity: 0;
        transform: translateX(7px);
        pointer-events: none;
    }

    .read-aloud-arrow {
        font-family: Arial, sans-serif;
        font-size: 13px;
        opacity: .65;
    }

    /* Mobile */
    @media (max-width: 1300px) {

        .custom-badge {
            right: 30px;
            bottom: 16px;

            height: 33px;
            min-width: 200px;

            padding: 0 12px;
            gap: 5px;

            font-size: 9.5px;
        }

        .read-aloud-wrap {
            right: 30px;
            bottom: 55px;
        }

        .read-aloud-btn {
            width: 38px;
            height: 38px;
            flex-basis: 38px;
            font-size: 14px;
        }

        .read-aloud-tip {
            font-size: 9.5px;
            padding: 6px 9px;
        }

        .custom-badge::before {
            font-size: 9px;
        }

        .custom-badge::after {
            left: 9px;
            right: 9px;
            bottom: -2px;
        }
    }

    </style>
</head>

<body>

<div class="portfolio">

    <iframe
        src="https://himanshu-ai-engineer-od6xye1.gamma.site/"
        title="Himanshu Singh Portfolio"
        allow="fullscreen">
    </iframe>

    <!-- Floating Read Aloud button -->
    <div class="read-aloud-wrap" id="readAloudWrap">
        <div class="read-aloud-tip" id="readAloudTip">
            <span>Click to play intro</span>
            <span class="read-aloud-arrow">→</span>
        </div>
        <button class="read-aloud-btn" id="readAloudBtn" aria-label="Read aloud" title="Read Aloud">
            ▶
        </button>
    </div>

    <!-- Custom badge -->
    <div class="custom-badge" id="easterEgg">
        Built with love by Himanshu
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    /* Read Aloud button - independent from the Made with Love badge */
    const readAloudBtn = document.getElementById("readAloudBtn");
    const readAloudTip = document.getElementById("readAloudTip");

    const portfolioIntro = `
Hi, I'm Himanshu.

I work with the AI Innovation Lab at TCS, where I work on building practical AI and Generative AI solutions for real-world healthcare problems.

My work involves things like LLM applications, RAG, AI agents, OCR, document intelligence, and intelligent automation — basically taking an idea, figuring out where AI actually makes sense, and turning it into something that can be used.

Before getting into this space, my background was in Data Engineering, working with large-scale data, cloud platforms, Spark, Databricks, and Azure. That experience still plays a big role in how I approach AI today, especially when it comes to building solutions that need to work beyond just a prototype.

So, that's a little about what I do.
Take a look around — and hopefully you'll find something interesting along the way.
`;

    let availableVoices = [];
    let selectedVoice = null;

    function loadVoices() {
        const voices = speechSynthesis.getVoices();
        if (!voices.length) return;

        availableVoices = voices;

        const english = voices.filter(v => /^en[-_]/i.test(v.lang));

        // Prefer identifiable male English voices; do not intentionally choose a female voice.
        const male = english.filter(v =>
            /male|guy|ryan|david|mark|george|daniel|alex|james|thomas|aaron|matthew|arthur/i.test(v.name)
        );

        selectedVoice =
            male.find(v => /natural|neural|microsoft|google/i.test(v.name)) ||
            male.find(v => /^en-US/i.test(v.lang)) ||
            male.find(v => /^en-GB/i.test(v.lang)) ||
            male[0] ||
            null;
    }

    speechSynthesis.addEventListener("voiceschanged", loadVoices);
    loadVoices();

    async function waitForVoices(maxWait = 1000) {
        const started = Date.now();

        while (!availableVoices.length && Date.now() - started < maxWait) {
            await new Promise(resolve => setTimeout(resolve, 100));
            loadVoices();
        }
    }

    function resetReadAloudButton() {
        readAloudBtn.textContent = "▶";
        readAloudBtn.title = "Read Aloud";
        readAloudBtn.setAttribute("aria-label", "Read Aloud");
    }

    readAloudBtn.addEventListener("click", async function () {
        if (speechSynthesis.paused) {
            speechSynthesis.resume();
            readAloudBtn.textContent = "||";
            readAloudBtn.title = "Pause";
            return;
        }

        if (speechSynthesis.speaking) {
            speechSynthesis.pause();
            readAloudBtn.textContent = "▶";
            readAloudBtn.title = "Resume";
            return;
        }

        await waitForVoices(10000);
        speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(portfolioIntro);

        if (selectedVoice) {
            speech.voice = selectedVoice;
        }

        speech.rate = 0.85;
        speech.pitch = .85;
        speech.volume = 1.0;
        speech.lang = "en-US";

        speech.onstart = function () {
            readAloudBtn.textContent = "||";
            readAloudBtn.title = "Pause";
        };

        speech.onend = resetReadAloudButton;
        speech.onerror = resetReadAloudButton;

        speechSynthesis.speak(speech);
    });

    // Show the hint for about 2 seconds after page load.
    setTimeout(function () {
        readAloudTip.classList.add("hide");
    }, 4000);

    const badge = document.getElementById("easterEgg");

    badge.addEventListener("click", function () {
        window.location.href = "./easter-egg.html";
    });
});
</script>

</body>
</html>
