<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Himanshu Singh | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        .portfolio {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    .custom-badge {
        position: absolute;

        /* Move slightly lower */
        right: clamp(8px, 1.2vw, 20px);
        bottom: clamp(2px, 0.5vw, 7px);

        z-index: 9999;

        /* Slightly larger for better coverage */
        height: clamp(36px, 3vw, 44px);
        min-width: clamp(185px, 17vw, 245px);

        padding: 0 clamp(16px, 1.3vw, 22px);

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;

        background: #ffffff;
        color: #3b2417;

        border: 1px solid rgba(59, 36, 23, 0.20);
        border-radius: 999px;

        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(11px, 0.95vw, 14px);
        font-weight: 600;
        letter-spacing: 0.1px;

        box-shadow:
            0 4px 14px rgba(0, 0, 0, 0.14),
            0 1px 4px rgba(0, 0, 0, 0.08);

        white-space: nowrap;

        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }

    .custom-badge::before {
        content: "♡";
        color: #6f5959;
        font-size: clamp(10px, 0.85vw, 13px);
        line-height: 1;
        animation: heartbeat 5.2s ease-in-out infinite;
    }

    @keyframes heartbeat {
        0%, 100% {
            transform: scale(1.3);
        }
        50% {
            transform: scale(1.5);
        }
    }

    .custom-badge::after {
        content: "";
        position: absolute;

        left: 12px;
        right: 12px;
        bottom: -3px;

        height: 1px;
        background: rgba(59, 36, 23, 0.18);
    }


    /* Mobile */
    @media (max-width: 1300px) {

        .custom-badge {
            right: 30px;
            bottom: 16px;

            height: 33px;
            min-width: 200px;

            padding: 0 12px;
            gap: 5px;

            font-size: 9.5px;
        }

        .custom-badge::before {
            font-size: 9px;
        }

        .custom-badge::after {
            left: 9px;
            right: 9px;
            bottom: -2px;
        }
    }
    </style>
</head>

<body>

<div class="portfolio">

    <iframe
        src="https://himanshu-ai-engineer-od6xye1.gamma.site/"
        title="Himanshu Singh Portfolio"
        allow="fullscreen">
    </iframe>

    <!-- Custom badge -->
    <div class="custom-badge">
        Built with love by Himanshu
    </div>

</div>

</body>
</html>
