<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Himanshu Singh | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        .portfolio {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    .custom-badge {
        position: absolute;

        /* Move slightly lower */
        right: clamp(8px, 1.2vw, 20px);
        bottom: clamp(2px, 0.5vw, 7px);

        cursor: pointer !important;
        pointer-events: auto !important;
        z-index: 999999 !important;

        /* Slightly larger for better coverage */
        height: clamp(36px, 3vw, 44px);
        min-width: clamp(185px, 17vw, 245px);

        padding: 0 clamp(16px, 1.3vw, 22px);

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;

        background: #ffffff;
        color: #3b2417;

        border: 1px solid rgba(59, 36, 23, 0.20);
        border-radius: 999px;

        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(11px, 0.95vw, 14px);
        font-weight: 600;
        letter-spacing: 0.1px;

        box-shadow:
            0 4px 14px rgba(0, 0, 0, 0.14),
            0 1px 4px rgba(0, 0, 0, 0.08);

        white-space: nowrap;

        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }

    .custom-badge::before {
        content: "♡";
        color: #6f5959;
        font-size: clamp(10px, 0.85vw, 13px);
        line-height: 1;
        animation: heartbeat 5.2s ease-in-out infinite;
    }

    @keyframes heartbeat {
        0%, 100% {
            transform: scale(1.3);
        }
        50% {
            transform: scale(1.5);
        }
    }

    .custom-badge::after {
        content: "";
        position: absolute;

        left: 12px;
        right: 12px;
        bottom: -3px;

        height: 1px;
        background: rgba(59, 36, 23, 0.18);
    }


    /* Mobile */
    @media (max-width: 1300px) {

        .custom-badge {
            right: 30px;
            bottom: 16px;

            height: 33px;
            min-width: 200px;

            padding: 0 12px;
            gap: 5px;

            font-size: 9.5px;
        }

        .custom-badge::before {
            font-size: 9px;
        }

        .custom-badge::after {
            left: 9px;
            right: 9px;
            bottom: -2px;
        }
    }

    /* Floating Read Aloud button */
    .read-aloud-btn {
        position: absolute;
        left: clamp(14px, 1.5vw, 24px);
        bottom: clamp(14px, 1.5vw, 24px);

        width: clamp(42px, 3vw, 48px);
        height: clamp(42px, 3vw, 48px);

        display: flex;
        align-items: center;
        justify-content: center;

        border: 1px solid rgba(59, 36, 23, 0.18);
        border-radius: 50%;

        background: rgba(255, 255, 255, 0.72);
        color: #3b2417;

        font-size: clamp(14px, 1.1vw, 17px);
        cursor: pointer;

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        box-shadow:
            0 4px 14px rgba(0, 0, 0, 0.12),
            0 1px 4px rgba(0, 0, 0, 0.06);

        z-index: 999999 !important;
        transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .read-aloud-btn:hover {
        transform: scale(1.06);
        background: rgba(255, 255, 255, 0.88);
        box-shadow:
            0 6px 18px rgba(0, 0, 0, 0.15),
            0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .read-aloud-btn:active {
        transform: scale(0.96);
    }
    
    </style>
</head>

<body>

<div class="portfolio">

    <iframe
        src="https://himanshu-ai-engineer-od6xye1.gamma.site/"
        title="Himanshu Singh Portfolio"
        allow="fullscreen">
    </iframe>

    <!-- Floating Read Aloud button -->
    <button class="read-aloud-btn" id="readAloudBtn" aria-label="Read aloud" title="Read Aloud">
        ▶
    </button>

    <!-- Custom badge -->
    <div class="custom-badge" id="easterEgg">
        Built with love by Himanshu
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    /* Read Aloud button - independent from the Made with Love badge */
    const readAloudBtn = document.getElementById("readAloudBtn");

const portfolioIntro = `
Hi, I'm Himanshu.

I work with the AI Innovation Lab at TCS, where I work on building practical AI and Generative AI solutions for real-world healthcare problems.

My work involves things like LLM applications, RAG, AI agents, OCR, document intelligence, and intelligent automation — basically taking an idea, figuring out where AI actually makes sense, and turning it into something that can be used.

Before getting into this space, my background was in Data Engineering, working with large-scale data, cloud platforms, Spark, Databricks, and Azure. That experience still plays a big role in how I approach AI today, especially when it comes to building solutions that need to work beyond just a prototype.

So, that's a little about what I do.

Thanks for visiting my portfolio.
Take a look around — and hopefully you'll find something interesting along the way.
`;

    let isSpeaking = false;

    readAloudBtn.addEventListener("click", function () {
        if (speechSynthesis.speaking && !speechSynthesis.paused) {
            speechSynthesis.pause();
            readAloudBtn.textContent = "▶";
            readAloudBtn.title = "Resume";
            return;
        }

        if (speechSynthesis.paused) {
            speechSynthesis.resume();
            readAloudBtn.textContent = "Ⅱ";
            readAloudBtn.title = "Pause";
            return;
        }

        speechSynthesis.cancel();

        

        const speech = new SpeechSynthesisUtterance(portfolioIntro);

        // Choose the best available natural English voice
        const voices = speechSynthesis.getVoices();

        const preferredVoice =
            voices.find(v => /Microsoft.*(Jenny|Aria|Sonia|Guy|Ryan)/i.test(v.name)) ||
            voices.find(v => /Google.*(US English|UK English)/i.test(v.name)) ||
            voices.find(v => /^en-US$/i.test(v.lang)) ||
            voices.find(v => /^en-GB$/i.test(v.lang)) ||
            voices.find(v => /^en/i.test(v.lang));

        if (preferredVoice) {
            speech.voice = preferredVoice;
        }

        speech.rate = 0.90;
        speech.pitch = 1;
        speech.volume = 1;

        speech.onstart = function () {
            isSpeaking = true;
            readAloudBtn.textContent = "Ⅱ";
            readAloudBtn.title = "Pause";
        };

        speech.onend = function () {
            isSpeaking = false;
            readAloudBtn.textContent = "▶";
            readAloudBtn.title = "Read Aloud";
        };

        speech.onerror = function () {
            isSpeaking = false;
            readAloudBtn.textContent = "▶";
            readAloudBtn.title = "Read Aloud";
        };

        speechSynthesis.speak(speech);
    });

    const badge = document.getElementById("easterEgg");

    badge.addEventListener("click", function () {
        window.location.href = "./easter-egg.html";
    });
});
</script>

</body>
</html>
