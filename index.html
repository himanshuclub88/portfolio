<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Himanshu Singh | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        .portfolio {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    .custom-badge {
        position: absolute;

        /* Move slightly lower */
        right: clamp(8px, 1.2vw, 20px);
        bottom: clamp(2px, 0.5vw, 7px);

        cursor: pointer !important;
        pointer-events: auto !important;
        z-index: 999999 !important;

        /* Slightly larger for better coverage */
        height: clamp(36px, 3vw, 44px);
        min-width: clamp(185px, 17vw, 245px);

        padding: 0 clamp(16px, 1.3vw, 22px);

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;

        background: #ffffff;
        color: #3b2417;

        border: 1px solid rgba(59, 36, 23, 0.20);
        border-radius: 999px;

        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(11px, 0.95vw, 14px);
        font-weight: 600;
        letter-spacing: 0.1px;

        box-shadow:
            0 4px 14px rgba(0, 0, 0, 0.14),
            0 1px 4px rgba(0, 0, 0, 0.08);

        white-space: nowrap;

        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }

    .custom-badge::before {
        content: "♡";
        color: #6f5959;
        font-size: clamp(10px, 0.85vw, 13px);
        line-height: 1;
        animation: heartbeat 5.2s ease-in-out infinite;
    }

    @keyframes heartbeat {
        0%, 100% {
            transform: scale(1.3);
        }
        50% {
            transform: scale(1.5);
        }
    }

    .custom-badge::after {
        content: "";
        position: absolute;

        left: 12px;
        right: 12px;
        bottom: -3px;

        height: 1px;
        background: rgba(59, 36, 23, 0.18);
    }


    /* Read Aloud - separate floating control, aligned with the existing badge */
    .read-aloud-wrap {
        position: absolute;
        right: clamp(8px, 1.2vw, 20px);
        bottom: clamp(48px, 4.4vw, 62px);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 9px;
        z-index: 999999 !important;
        pointer-events: none;
    }

    .read-aloud-btn {
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        border: 1px solid rgba(59, 36, 23, 0.18);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.72);
        color: #3b2417;
        font-family: Arial, sans-serif;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        pointer-events: auto;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 14px rgba(0,0,0,.12), 0 1px 4px rgba(0,0,0,.06);
        transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .read-aloud-btn:hover {
        transform: scale(1.06);
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 6px 18px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.08);
    }

    .read-aloud-btn:active {
        transform: scale(.96);
    }

    .read-aloud-tip {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 10px;
        border: 1px solid rgba(59,36,23,.14);
        border-radius: 9px;
        background: rgba(255,255,255,.86);
        color: #3b2417;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 14px rgba(0,0,0,.10);
        opacity: 1;
        transform: translateX(0);
        transition: opacity .35s ease, transform .35s ease;
    }

    .read-aloud-tip.hide {
        opacity: 0;
        transform: translateX(7px);
        pointer-events: none;
    }

    .read-aloud-arrow {
        font-family: Arial, sans-serif;
        font-size: 13px;
        opacity: .65;
    }

    /* Mobile */
    @media (max-width: 1300px) {

        .custom-badge {
            right: 30px;
            bottom: 16px;

            height: 33px;
            min-width: 200px;

            padding: 0 12px;
            gap: 5px;

            font-size: 9.5px;
        }

        .read-aloud-wrap {
            right: 30px;
            bottom: 55px;
        }

        .read-aloud-btn {
            width: 38px;
            height: 38px;
            flex-basis: 38px;
            font-size: 14px;
        }

        .read-aloud-tip {
            font-size: 9.5px;
            padding: 6px 9px;
        }

        .custom-badge::before {
            font-size: 9px;
        }

        .custom-badge::after {
            left: 9px;
            right: 9px;
            bottom: -2px;
        }
    }



    /* ==============================
       Himanshu AI Assistant Chatbot
       ============================== */
    .chatbot-launcher {
        position: fixed;
        left: clamp(18px, 1.8vw, 30px);
        bottom: clamp(22px, 2.2vw, 34px);
        width: clamp(52px, 4.2vw, 66px);
        height: clamp(52px, 4.2vw, 66px);
        padding: 0;
        border: 1px solid rgba(59, 36, 23, 0.16);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 8px 26px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.10);
        cursor: pointer;
        z-index: 1000000;
        overflow: visible;
        transition: transform .22s ease, box-shadow .22s ease;
        animation: chatbotFloat 3.2s ease-in-out infinite;
    }

    .chatbot-launcher:hover {
        transform: scale(1.08);
        box-shadow: 0 12px 32px rgba(0,0,0,.20), 0 3px 10px rgba(0,0,0,.12);
        animation-play-state: paused;
    }

    .chatbot-launcher:active {
        transform: scale(.96);
    }

    .chatbot-launcher::after {
        content: "";
        position: absolute;
        inset: -5px;
        border: 1px solid rgba(59, 36, 23, .12);
        border-radius: 50%;
        animation: chatbotPulse 2.8s ease-out infinite;
        pointer-events: none;
    }

    .chatbot-launcher .bot-icon {
        width: 64%;
        height: 64%;
        display: block;
        margin: auto;
        color: #3b2417;
        animation: botBreathe 2.6s ease-in-out infinite;
    }

    @keyframes botBreathe {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-1px) scale(1.04); }
    }

    .chatbot-launcher .chatbot-fallback {
        display: none;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #fff;
        color: #3b2417;
        font: 700 16px Georgia, "Times New Roman", serif;
    }

    @keyframes chatbotFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }

    @keyframes chatbotPulse {
        0% { transform: scale(.92); opacity: .65; }
        70%, 100% { transform: scale(1.18); opacity: 0; }
    }

    .chatbot-window {
        position: fixed;
        left: clamp(18px, 1.8vw, 30px);
        bottom: clamp(92px, 8.5vw, 118px);
        width: min(370px, calc(100vw - 28px));
        height: min(560px, calc(100vh - 180px));
        min-height: 390px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(59, 36, 23, .15);
        border-radius: 20px;
        background: rgba(255,255,255,.96);
        box-shadow: 0 18px 55px rgba(0,0,0,.22), 0 4px 14px rgba(0,0,0,.10);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        z-index: 1000001;
        opacity: 0;
        visibility: hidden;
        transform: translateY(14px) scale(.97);
        transform-origin: bottom right;
        pointer-events: none;
        transition: opacity .22s ease, transform .22s ease, visibility .22s ease;
        font-family: Arial, Helvetica, sans-serif;
    }

    .chatbot-window.open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
    }

    .chatbot-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 15px;
        border-bottom: 1px solid rgba(59,36,23,.10);
        background: rgba(255,255,255,.88);
    }

    .chatbot-title-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
    }

    .chatbot-mini-avatar {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid rgba(59,36,23,.12);
    }

    .chatbot-title {
        color: #2f2119;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.25;
    }

    .chatbot-status {
        margin-top: 3px;
        color: #77706b;
        font-size: 10px;
    }

    .chatbot-close {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #5c514a;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
    }

    .chatbot-close:hover {
        background: rgba(59,36,23,.07);
    }

    .chatbot-messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 16px 13px 12px;
        scroll-behavior: smooth;
    }

    .chatbot-message {
        display: flex;
        margin: 0 0 11px;
    }

    .chatbot-message.user {
        justify-content: flex-end;
    }

    .chatbot-bubble {
        max-width: 84%;
        padding: 10px 12px;
        border-radius: 15px;
        color: #30251f;
        background: #f4f1ee;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .chatbot-message.user .chatbot-bubble {
        color: #fff;
        background: #3b2417;
        border-bottom-right-radius: 5px;
    }

    .chatbot-message.assistant .chatbot-bubble {
        border-bottom-left-radius: 5px;
    }

    .chatbot-typing {
        display: none;
        width: fit-content;
        margin: 0 0 11px;
        padding: 9px 12px;
        border-radius: 15px;
        border-bottom-left-radius: 5px;
        background: #f4f1ee;
    }

    .chatbot-typing.show {
        display: flex;
        gap: 4px;
    }

    .chatbot-typing span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #8a7d73;
        animation: chatbotTyping 1s infinite ease-in-out;
    }

    .chatbot-typing span:nth-child(2) { animation-delay: .14s; }
    .chatbot-typing span:nth-child(3) { animation-delay: .28s; }

    @keyframes chatbotTyping {
        0%, 60%, 100% { transform: translateY(0); opacity: .45; }
        30% { transform: translateY(-3px); opacity: 1; }
    }

    .chatbot-input-area {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 11px;
        border-top: 1px solid rgba(59,36,23,.10);
        background: rgba(255,255,255,.90);
    }

    .chatbot-input {
        flex: 1;
        min-width: 0;
        max-height: 90px;
        resize: none;
        padding: 10px 11px;
        border: 1px solid rgba(59,36,23,.15);
        border-radius: 13px;
        outline: none;
        color: #2f2119;
        background: #faf9f8;
        font: 12px/1.4 Arial, Helvetica, sans-serif;
    }

    .chatbot-input:focus {
        border-color: rgba(59,36,23,.35);
        background: #fff;
    }

    .chatbot-send {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        border: 0;
        border-radius: 12px;
        background: #3b2417;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
        transition: transform .15s ease, opacity .15s ease;
    }

    .chatbot-send:hover { transform: translateY(-1px); }
    .chatbot-send:disabled { opacity: .45; cursor: default; transform: none; }

    .chatbot-note {
        padding: 0 13px 9px;
        color: #9a928d;
        background: rgba(255,255,255,.90);
        font-size: 8.5px;
        text-align: center;
    }

    @media (max-width: 600px) {
        .chatbot-launcher {
            right: 14px;
            bottom: 66px;
            width: 56px;
            height: 56px;
        }

        .chatbot-window {
            right: 12px;
            left: 12px;
            bottom: 132px;
            width: auto;
            height: min(560px, calc(100vh - 155px));
            min-height: 360px;
            border-radius: 18px;
        }
    }

    /* Chat response Play / Pause */
    .chatbot-message.assistant .chatbot-bubble {
        position: relative;
        padding-right: 42px;
    }

    .chatbot-speak-btn {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 26px;
        height: 26px;
        padding: 0;
        border: 1px solid rgba(59,36,23,.16);
        border-radius: 50%;
        background: #fff;
        color: #3b2417;
        font: 700 11px Arial, sans-serif;
        line-height: 26px;
        text-align: center;
        cursor: pointer;
        z-index: 10;
        pointer-events: auto;
        -webkit-appearance: none;
        appearance: none;
    }

    .chatbot-speak-btn:hover {
        transform: scale(1.06);
    }


    /* Voice input button */
    .chatbot-voice {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        border: 1px solid rgba(59,36,23,.14);
        border-radius: 12px;
        background: #fff;
        color: #3b2417;
        font-size: 16px;
        cursor: pointer;
        transition: transform .15s ease, opacity .15s ease, background .15s ease;
    }

    .chatbot-voice:hover { transform: translateY(-1px); }
    .chatbot-voice.listening {
        background: #3b2417;
        color: #fff;
        animation: voicePulse 1.2s ease-in-out infinite;
    }

    @keyframes voicePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }

    
    /* Compact Markdown rendering inside the small chatbot */
    .chatbot-bubble.markdown-body {
        white-space: normal;
        word-break: break-word;
    }

    .chatbot-bubble.markdown-body > :first-child {
        margin-top: 0;
    }

    .chatbot-bubble.markdown-body > :last-child {
        margin-bottom: 0;
    }

    .chatbot-bubble.markdown-body p {
        margin: 0 0 7px;
    }

    .chatbot-bubble.markdown-body h1,
    .chatbot-bubble.markdown-body h2,
    .chatbot-bubble.markdown-body h3,
    .chatbot-bubble.markdown-body h4 {
        color: #2f2119;
        line-height: 1.25;
        margin: 8px 0 5px;
        font-weight: 700;
    }

    .chatbot-bubble.markdown-body h1 { font-size: 15px; }
    .chatbot-bubble.markdown-body h2 { font-size: 14px; }
    .chatbot-bubble.markdown-body h3 { font-size: 13px; }
    .chatbot-bubble.markdown-body h4 { font-size: 12px; }

    .chatbot-bubble.markdown-body ul,
    .chatbot-bubble.markdown-body ol {
        margin: 4px 0 7px;
        padding-left: 18px;
    }

    .chatbot-bubble.markdown-body li {
        margin: 2px 0;
    }

    .chatbot-bubble.markdown-body strong {
        font-weight: 700;
    }

    .chatbot-bubble.markdown-body em {
        font-style: italic;
    }

    .chatbot-bubble.markdown-body code {
        padding: 1px 4px;
        border-radius: 4px;
        background: rgba(59,36,23,.08);
        font-family: Consolas, "Courier New", monospace;
        font-size: .9em;
    }

    .chatbot-bubble.markdown-body pre {
        margin: 6px 0;
        padding: 8px;
        overflow-x: auto;
        border-radius: 8px;
        background: #2f2925;
        color: #fff;
        font-size: 10px;
        line-height: 1.4;
    }

    .chatbot-bubble.markdown-body pre code {
        padding: 0;
        background: transparent;
        color: inherit;
        font-size: inherit;
    }

    .chatbot-bubble.markdown-body blockquote {
        margin: 6px 0;
        padding-left: 8px;
        border-left: 3px solid rgba(59,36,23,.22);
        color: #655b55;
    }

    .chatbot-bubble.markdown-body a {
        color: #6b3f25;
        text-decoration: underline;
        overflow-wrap: anywhere;
    }

    .chatbot-bubble.markdown-body hr {
        border: 0;
        border-top: 1px solid rgba(59,36,23,.14);
        margin: 8px 0;
    }

    .chatbot-bubble.markdown-body table {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
        margin: 6px 0;
        font-size: 10px;
    }

    .chatbot-bubble.markdown-body th,
    .chatbot-bubble.markdown-body td {
        padding: 4px 6px;
        border: 1px solid rgba(59,36,23,.14);
        text-align: left;
    }

    .chatbot-bubble.markdown-body th {
        background: rgba(59,36,23,.06);
        font-weight: 700;
    }

    /* Keep the speak button floating over Markdown content */
    .chatbot-message.assistant .chatbot-bubble.markdown-body {
        padding-right: 42px;
    }

<body>

<div class="portfolio">

    <iframe
        src="https://himanshu-ai-engineer-od6xye1.gamma.site/"
        title="Himanshu Singh Portfolio"
        allow="fullscreen">
    </iframe>

    <!-- Floating Read Aloud button -->
    <div class="read-aloud-wrap" id="readAloudWrap">
        <div class="read-aloud-tip" id="readAloudTip">
            <span>Click to play intro</span>
            <span class="read-aloud-arrow">→</span>
        </div>
        <button class="read-aloud-btn" id="readAloudBtn" aria-label="Read aloud" title="Read Aloud">
            ▶
        </button>
    </div>

    <!-- Custom badge -->
    <div class="custom-badge" id="easterEgg">
        Built with love by Himanshu
    </div>


    <!-- Floating AI Assistant -->
    <button class="chatbot-launcher" id="chatbotLauncher" type="button" aria-label="Open Himanshu Singh Assistant" title="Ask Himanshu Singh Assistant">
        <svg class="bot-icon" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 8v7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <circle cx="32" cy="6" r="2.5" fill="currentColor"/>
            <rect x="13" y="17" width="38" height="32" rx="11" fill="none" stroke="currentColor" stroke-width="3"/>
            <circle cx="25" cy="31" r="3.2" fill="currentColor"/>
            <circle cx="39" cy="31" r="3.2" fill="currentColor"/>
            <path d="M24 40c4.5 3.5 11.5 3.5 16 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M13 29H8M51 29h5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
    </button>

    <section class="chatbot-window" id="chatbotWindow" aria-label="Himanshu Singh Assistant">
        <div class="chatbot-header">
            <div class="chatbot-title-wrap">
                <img class="chatbot-mini-avatar" src="./chatbot.jpg" alt="" id="chatbotHeaderImage">
                <div>
                    <div class="chatbot-title">Himanshu Singh Assistant</div>
                    <div class="chatbot-status">Ask me about Himanshu</div>
                </div>
            </div>
            <button class="chatbot-close" id="chatbotClose" type="button" aria-label="Close chatbot">×</button>
        </div>

        <div class="chatbot-messages" id="chatbotMessages">
            <div class="chatbot-message assistant">
                <div class="chatbot-bubble">Hi, I’m Himanshu Singh Assistant. What would you like to know about Himanshu Singh?</div>
            </div>
            <div class="chatbot-typing" id="chatbotTyping" aria-label="Assistant is typing">
                <span></span><span></span><span></span>
            </div>
        </div>

        <div class="chatbot-input-area">
            <textarea class="chatbot-input" id="chatbotInput" rows="1" placeholder="Ask something about Himanshu..."></textarea>
            <button class="chatbot-voice" id="chatbotVoice" type="button" aria-label="Speak your question" title="Speak your question">🎙</button>
            <button class="chatbot-send" id="chatbotSend" type="button" aria-label="Send message">➤</button>
        </div>
        <div class="chatbot-note">Powered by Himanshu’s AI assistant API</div>
    </section>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    /* Read Aloud button - independent from the Made with Love badge */
    const readAloudBtn = document.getElementById("readAloudBtn");
    const readAloudTip = document.getElementById("readAloudTip");

    const portfolioIntro = `
Hi, I'm Himanshu.

I work with the AI Innovation Lab at TCS, where I work on building practical AI and Generative AI solutions for real-world healthcare problems.

My work involves things like LLM applications, RAG, AI agents, OCR, document intelligence, and intelligent automation — basically taking an idea, figuring out where AI actually makes sense, and turning it into something that can be used.

Before getting into this space, my background was in Data Engineering, working with large-scale data, cloud platforms, Spark, Databricks, and Azure. That experience still plays a big role in how I approach AI today, especially when it comes to building solutions that need to work beyond just a prototype.

So, that's a little about what I do.
Take a look around — and hopefully you'll find something interesting along the way.

And if you'd like to know more about me, you can also use my AI assistant chatbot to ask questions and have a conversation about my experience, skills, and projects.
`;

    let availableVoices = [];
    let selectedVoice = null;

    function loadVoices() {
        const voices = speechSynthesis.getVoices();
        if (!voices.length) return;

        availableVoices = voices;

        const english = voices.filter(v => /^en[-_]/i.test(v.lang));

        // Prefer identifiable male English voices; do not intentionally choose a female voice.
        const male = english.filter(v =>
            /male|guy|ryan|david|mark|george|daniel|alex|james|thomas|aaron|matthew|arthur/i.test(v.name)
        );

        selectedVoice =
            male.find(v => /natural|neural|microsoft|google/i.test(v.name)) ||
            male.find(v => /^en-US/i.test(v.lang)) ||
            male.find(v => /^en-GB/i.test(v.lang)) ||
            male[0] ||
            null;
    }

    speechSynthesis.addEventListener("voiceschanged", loadVoices);
    loadVoices();

    async function waitForVoices(maxWait = 1000) {
        const started = Date.now();

        while (!availableVoices.length && Date.now() - started < maxWait) {
            await new Promise(resolve => setTimeout(resolve, 100));
            loadVoices();
        }
    }

    function resetReadAloudButton() {
        readAloudBtn.textContent = "▶";
        readAloudBtn.title = "Read Aloud";
        readAloudBtn.setAttribute("aria-label", "Read Aloud");
    }

    readAloudBtn.addEventListener("click", async function () {
        if (speechSynthesis.paused) {
            speechSynthesis.resume();
            readAloudBtn.textContent = "||";
            readAloudBtn.title = "Pause";
            return;
        }

        if (speechSynthesis.speaking) {
            speechSynthesis.pause();
            readAloudBtn.textContent = "▶";
            readAloudBtn.title = "Resume";
            return;
        }

        await waitForVoices(10000);
        speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(portfolioIntro);

        if (selectedVoice) {
            speech.voice = selectedVoice;
        }

        speech.rate = 0.85;
        speech.pitch = .85;
        speech.volume = 1.0;
        speech.lang = "en-US";

        speech.onstart = function () {
            readAloudBtn.textContent = "||";
            readAloudBtn.title = "Pause";
        };

        speech.onend = resetReadAloudButton;
        speech.onerror = resetReadAloudButton;

        speechSynthesis.speak(speech);
    });

    // Show the hint for about 2 seconds after page load.
    setTimeout(function () {
        readAloudTip.classList.add("hide");
    }, 4000);

    const badge = document.getElementById("easterEgg");

    badge.addEventListener("click", function () {
        window.location.href = "./easter-egg.html";
    });

    /* ==============================
       Himanshu AI Assistant
       Replace this URL with your real backend endpoint.
       ============================== */
    // const CHATBOT_API_URL = "https://himanshuclub88.pythonanywhere.com/chat";
    const CHATBOT_API_URL = "http://localhost:8000/chat";
    const chatbotLauncher = document.getElementById("chatbotLauncher");
    const chatbotWindow = document.getElementById("chatbotWindow");
    const chatbotClose = document.getElementById("chatbotClose");
    const chatbotMessages = document.getElementById("chatbotMessages");
    const chatbotInput = document.getElementById("chatbotInput");
    const chatbotSend = document.getElementById("chatbotSend");
    const chatbotVoice = document.getElementById("chatbotVoice");
    const chatbotTyping = document.getElementById("chatbotTyping");
    const chatbotLauncherImage = document.getElementById("chatbotLauncherImage");
    const chatbotFallback = document.getElementById("chatbotFallback");
    const chatbotHeaderImage = document.getElementById("chatbotHeaderImage");

    let conversationId = localStorage.getItem("himanshu_chat_conversation_id") || null;

    function openChatbot() {
        chatbotWindow.classList.add("open");
        chatbotInput.focus();
    }

    function closeChatbot() {
        chatbotWindow.classList.remove("open");
    }

    function markdownToSafeHtml(text) {
        const source = String(text ?? "");

        // Fallback: if the Markdown libraries are unavailable, safely show plain text.
        if (!window.marked || !window.DOMPurify) {
            return null;
        }

        try {
            marked.setOptions({
                breaks: true,
                gfm: true
            });

            const rawHtml = marked.parse(source);
            return DOMPurify.sanitize(rawHtml, {
                USE_PROFILES: { html: true },
                ALLOWED_ATTR: [
                    "href", "title", "target", "rel",
                    "class", "align", "colspan", "rowspan"
                ]
            });
        } catch (error) {
            console.error("Markdown rendering error:", error);
            return null;
        }
    }

    function cleanTextForSpeech(text) {
        // Convert Markdown to HTML
        const html = marked.parse(String(text));

        // Convert HTML to plain visible text
        const temp = document.createElement("div");
        temp.innerHTML = html;

        // Return only readable text, without Markdown/HTML syntax
        return temp.textContent || temp.innerText || "";
    }


    function addMessage(text, role) {
        const row = document.createElement("div");
        row.className = "chatbot-message " + role;

        const bubble = document.createElement("div");
        bubble.className = "chatbot-bubble";

        const rawText = String(text ?? "");

        if (role === "assistant") {
            const renderedHtml = markdownToSafeHtml(rawText);

            if (renderedHtml !== null) {
                bubble.classList.add("markdown-body");
                bubble.innerHTML = renderedHtml;
            } else {
                bubble.textContent = rawText;
            }
        } else {
            // User messages remain plain text. Never interpret user input as HTML/Markdown.
            bubble.textContent = rawText;
        }

        if (role === "assistant") {
            const speakBtn = document.createElement("button");
            speakBtn.type = "button";
            speakBtn.className = "chatbot-speak-btn";
            speakBtn.textContent = "▶";
            speakBtn.title = "Play response";
            speakBtn.setAttribute("aria-label", "Play response");

            // Keep the original Markdown as speech text so Markdown symbols
            // are not spoken aloud.
            speakBtn.dataset.speechText = cleanTextForSpeech(text);

            bubble.appendChild(speakBtn);
        }

        row.appendChild(bubble);
        chatbotMessages.insertBefore(row, chatbotTyping);
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;

        return role === "assistant"
            ? bubble.querySelector(".chatbot-speak-btn")
            : null;
        return role === "assistant"
            ? bubble.querySelector(".chatbot-speak-btn")
            : null;
    }

    function setTyping(show) {
        chatbotTyping.classList.toggle("show", show);
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
        chatbotSend.disabled = show;
    }

    async function sendChatMessage() {
        const message = chatbotInput.value.trim();
        if (!message || chatbotSend.disabled) return;

        addMessage(message, "user");
        chatbotInput.value = "";
        chatbotInput.style.height = "auto";
        setTyping(true);

        try {
            const response = await fetch(CHATBOT_API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message,
                    conversation_id: conversationId
                })
            });

            if (!response.ok) {
                throw new Error("API request failed: " + response.status);
            }

            const data = await response.json();

            // Expected backend response:
            // { "answer": "...", "conversation_id": "..." }
            const answer = data.answer || data.response || data.message;

            if (!answer) {
                throw new Error("No answer returned by API");
            }

            if (data.conversation_id) {
                conversationId = data.conversation_id;
                localStorage.setItem("himanshu_chat_conversation_id", conversationId);
            }

            const assistantSpeakBtn = addMessage(String(answer), "assistant");

            // Automatically speak the answer after a voice question.
            if (window.chatbotAutoSpeak) {
                window.chatbotAutoSpeak = false;
                setTimeout(function () {
                    if (assistantSpeakBtn) assistantSpeakBtn.click();
                }, 100);
            }
        } catch (error) {
            console.error("Himanshu Assistant API error:", error);
            addMessage(
                "AI usage limit reached right now. The assistant may be temporarily unavailable. Please try again later.","assistant");
        } finally {
            setTyping(false);
            chatbotInput.focus();
        }
    }

    chatbotLauncher.addEventListener("click", function () {
        if (chatbotWindow.classList.contains("open")) {
            closeChatbot();
        } else {
            openChatbot();
        }
    });

    chatbotClose.addEventListener("click", closeChatbot);
    chatbotSend.addEventListener("click", sendChatMessage);

    /* ==============================
       Voice input for chatbot
       Speak -> text appears -> send -> assistant speaks automatically.
       ============================== */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = function () {
            chatbotVoice.classList.add("listening");
            chatbotVoice.textContent = "■";
            chatbotVoice.title = "Stop listening";
            chatbotVoice.setAttribute("aria-label", "Stop listening");
        };

        recognition.onresult = function (event) {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            chatbotInput.value = transcript.trim();
            chatbotInput.style.height = "auto";
            chatbotInput.style.height = Math.min(chatbotInput.scrollHeight, 90) + "px";
        };

        let voiceSendTimer = null;

        recognition.onend = function () {
            chatbotVoice.classList.remove("listening");
            chatbotVoice.textContent = "🎙";
            chatbotVoice.title = "Speak your question";
            chatbotVoice.setAttribute("aria-label", "Speak your question");

            if (chatbotInput.value.trim()) {
                clearTimeout(voiceSendTimer);

                voiceSendTimer = setTimeout(function () {
                    if (chatbotInput.value.trim()) {
                        window.chatbotAutoSpeak = true;
                        sendChatMessage();
                    }
                }, 1500);
            }
        };

        recognition.onerror = function (event) {
            console.error("Chatbot speech recognition error:", event.error);
            window.chatbotAutoSpeak = false;
            chatbotVoice.classList.remove("listening");
            chatbotVoice.textContent = "🎙";
            chatbotVoice.title = "Speak your question";
            chatbotVoice.setAttribute("aria-label", "Speak your question");
        };

        chatbotVoice.addEventListener("click", function () {
            if (chatbotVoice.classList.contains("listening")) {
                recognition.stop();
                return;
            }

            speechSynthesis.cancel();
            recognition.start();
        });
    } else {
        chatbotVoice.disabled = true;
        chatbotVoice.title = "Voice input is not supported in this browser";
        chatbotVoice.setAttribute("aria-label", "Voice input is not supported in this browser");
    }

    chatbotInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendChatMessage();
        }
    });

    chatbotInput.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 90) + "px";
    });

    /* ==============================
       Chat response speech
       Uses the same speechSynthesis/voice setup as Read Aloud above.
       ============================== */
    let activeChatSpeakBtn = null;

    function resetChatSpeakButton(button) {
        if (!button) return;
        button.textContent = "▶";
        button.title = "Play response";
        button.setAttribute("aria-label", "Play response");
    }

    document.addEventListener("click", async function (event) {
        const button = event.target.closest(".chatbot-speak-btn");
        if (!button) return;

        event.preventDefault();
        event.stopPropagation();

        const text = button.dataset.speechText || "";
        if (!text) return;

        if (activeChatSpeakBtn === button && speechSynthesis.paused) {
            speechSynthesis.resume();
            button.textContent = "||";
            button.title = "Pause";
            button.setAttribute("aria-label", "Pause response");
            return;
        }

        if (activeChatSpeakBtn === button && speechSynthesis.speaking) {
            speechSynthesis.pause();
            button.textContent = "▶";
            button.title = "Resume";
            button.setAttribute("aria-label", "Resume response");
            return;
        }

        if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
            return;
        }

        if (activeChatSpeakBtn && activeChatSpeakBtn !== button) {
            resetChatSpeakButton(activeChatSpeakBtn);
        }

        activeChatSpeakBtn = button;

        await waitForVoices(10000);
        speechSynthesis.cancel();

        const speechText = cleanTextForSpeech(text);
        const speech = new SpeechSynthesisUtterance(text);

        if (selectedVoice) {
            speech.voice = selectedVoice;
        }

        speech.rate = 0.85;
        speech.pitch = 0.85;
        speech.volume = 1.0;
        speech.lang = "en-US";

        speech.onstart = function () {
            button.textContent = "||";
            button.title = "Pause";
            button.setAttribute("aria-label", "Pause response");
        };

        speech.onend = function () {
            resetChatSpeakButton(button);
            if (activeChatSpeakBtn === button) activeChatSpeakBtn = null;
        };

        speech.onerror = function () {
            resetChatSpeakButton(button);
            if (activeChatSpeakBtn === button) activeChatSpeakBtn = null;
        };

        speechSynthesis.speak(speech);
    });

    // Add the same Play button to the initial assistant message.
    const initialAssistantBubble = chatbotMessages.querySelector(".chatbot-message.assistant .chatbot-bubble");
    if (initialAssistantBubble && !initialAssistantBubble.querySelector(".chatbot-speak-btn")) {
        const initialText = initialAssistantBubble.textContent.trim();
        const initialSpeakBtn = document.createElement("button");
        initialSpeakBtn.type = "button";
        initialSpeakBtn.className = "chatbot-speak-btn";
        initialSpeakBtn.textContent = "▶";
        initialSpeakBtn.title = "Play response";
        initialSpeakBtn.setAttribute("aria-label", "Play response");
        initialSpeakBtn.dataset.speechText = cleanTextForSpeech(initialText);
        initialAssistantBubble.appendChild(initialSpeakBtn);
    }

    // If chatbot.jpg is not present yet, keep a clean AI fallback instead of a broken image.
    function chatbotImageFallback(img) {
        img.style.display = "none";
        if (img === chatbotLauncherImage) chatbotFallback.style.display = "flex";
    }

    chatbotLauncherImage.addEventListener("error", function () {
        chatbotImageFallback(this);
    });

    chatbotHeaderImage.addEventListener("error", function () {
        this.style.display = "none";
    });

});
</script>

</body>
